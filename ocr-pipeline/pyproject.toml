[project]
name = "ocr-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
trocr = [
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not trocr'"
markers = ["trocr: runs the real TrOCR model (heavy; use in Colab with --extra trocr)"]
